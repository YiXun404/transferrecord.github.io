<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitVault Mobile - Transaction Details</title>
    <style>
        :root {
            --bg-main: #080a0f;
            --bg-card: #131722;
            --bg-inner: #181e2b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-inner: rgba(255, 255, 255, 0.04);
            --text-primary: #ffffff;
            --text-secondary: #8b94a5;
            --green-accent: #26a17b;
            --green-glow: rgba(38, 161, 123, 0.15);
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* 手机端容器：占满屏幕，自适应宽度 */
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            margin: 0 auto;
        }

        /* 1. App 原生导航顶栏 */
        .app-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px 20px 4px;
        }

        .nav-back {
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.3px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--green-accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 13px;
        }

        .nav-more {
            color: var(--text-secondary);
            font-size: 18px;
        }

        /* 2. 主卡片（融合电脑版 131722 卡片质感） */
        .main-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 头部状态与金额（特写焦点） */
        .hero-section {
            text-align: center;
            padding: 8px 0 4px 0;
        }

        .hero-badge {
            width: 44px;
            height: 44px;
            background: var(--green-glow);
            border: 1.5px solid var(--green-accent);
            color: var(--green-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin: 0 auto 12px;
        }

        .hero-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .hero-amount {
            font-size: 30px;
            font-weight: 800;
            color: var(--green-accent);
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
        }

        /* 3. 内嵌数据列表（复刻电脑版的 181e2b 模块风格） */
        .details-box {
            background-color: var(--bg-inner);
            border: 1px solid var(--border-inner);
            border-radius: 14px;
            padding: 6px 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid var(--border-inner);
            font-size: 13px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .value {
            color: var(--text-primary);
            font-weight: 500;
            text-align: right;
        }

        /* 颜色与等宽字体适配 */
        .val-green {
            color: var(--green-accent);
            font-weight: 600;
        }

        .val-mono {
            font-family: var(--font-mono);
            letter-spacing: -0.3px;
        }

        /* 4. 复刻第一张图底部的 Close 绿按钮 */
        .close-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--green-accent);
            color: #0b1118;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(38, 161, 123, 0.2);
            margin-top: 4px;
        }

        .close-btn:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- App 导航顶栏 -->
        <div class="app-nav">
            <span class="nav-back">‹</span>
            <div class="nav-brand">
                <div class="brand-icon">₮</div>
                <span>BitVault</span>
            </div>
            <span class="nav-more">⋮</span>
        </div>

        <!-- 主内容卡片（融合电脑版质感） -->
        <div class="main-card">
            
            <!-- 英雄区：状态与大字金额 -->
            <div class="hero-section">
                <div class="hero-badge">✓</div>
                <h1 class="hero-title">Transaction Details</h1>
                <p class="hero-subtitle">TRC-20 Transfer Verification</p>
                <div class="hero-amount">+ 3000.00 USDT</div>
            </div>

            <!-- 详细数据区块 -->
            <div class="details-box">
                <div class="detail-row">
                    <span class="label">Status:</span>
                    <span class="value val-green">Confirmed (28 blocks)</span>
                </div>

                <div class="detail-row">
                    <span class="label">Sender:</span>
                    <span class="value val-mono">0x7a3B...002a</span>
                </div>

                <div class="detail-row">
                    <span class="label">Recipient Vault:</span>
                    <span class="value val-mono">TRj9k...2vM4</span>
                </div>

                <div class="detail-row">
                    <span class="label">Timestamp:</span>
                    <span class="value">Today, 20:41:12 UTC</span>
                </div>

                <div class="detail-row">
                    <span class="label">TxHash:</span>
                    <span class="value val-green val-mono">0x12D3...3F99</span>
                </div>
            </div>

            <!-- 实色绿按钮 -->
            <button class="close-btn">Close</button>

        </div>

    </div>

</body>
</html>
